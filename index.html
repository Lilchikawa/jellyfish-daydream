
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jellyfish Daydream</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="post">
    <div class="water-glow"></div>
    <div class="light-ray ray-one"></div>
    <div class="light-ray ray-two"></div>

    <div class="distant-bubbles">
      <i style="--x:12%;--delay:0s;--duration:8s"></i>
      <i style="--x:25%;--delay:3s;--duration:10s"></i>
      <i style="--x:76%;--delay:1s;--duration:9s"></i>
      <i style="--x:89%;--delay:4s;--duration:11s"></i>
      <i style="--x:57%;--delay:2s;--duration:7s"></i>
      <i style="--x:42%;--delay:5s;--duration:10s"></i>
    </div>

    <div class="seaweed seaweed-left"><b></b><b></b><b></b></div>
    <div class="seaweed seaweed-right"><b></b><b></b><b></b></div>
    <div class="coral coral-left"><i></i><i></i><i></i><i></i></div>
    <div class="coral coral-right"><i></i><i></i><i></i><i></i></div>

    <div class="jelly jelly-main">
      <div class="cap">
        <span class="shine"></span>
        <span class="eye eye-left"></span>
        <span class="eye eye-right"></span>
        <span class="cheek cheek-left"></span>
        <span class="cheek cheek-right"></span>
        <span class="smile"></span>
      </div>
      <div class="tentacles"><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="jelly jelly-small jelly-pink">
      <div class="cap">
        <span class="shine"></span>
        <span class="eye eye-left"></span>
        <span class="eye eye-right"></span>
        <span class="cheek cheek-left"></span>
        <span class="cheek cheek-right"></span>
        <span class="smile"></span>
      </div>
      <div class="tentacles"><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="jelly jelly-small jelly-lavender">
      <div class="cap">
        <span class="shine"></span>
        <span class="eye eye-left"></span>
        <span class="eye eye-right"></span>
        <span class="cheek cheek-left"></span>
        <span class="cheek cheek-right"></span>
        <span class="smile"></span>
      </div>
      <div class="tentacles"><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="tiny-star star-a">✦</div>
    <div class="tiny-star star-b">✧</div>
    <div class="tiny-star star-c">✦</div>

    <div class="sand"></div>
    <div class="title-mark">JELLYFISH <span>DAYDREAM</span></div>
    <div class="subtitle">a tiny world under the sea</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
